name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Run Android lint
        run: gradle lintDebug --stacktrace
      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' -print -quit)"
          test -n "$release_apk"
          test -s "$release_apk"
          echo "Debug APK: app/build/outputs/apk/debug/app-debug.apk"
          echo "Release APK: $release_apk"
          echo "Release AAB: app/build/outputs/bundle/release/app-release.aab"
      - name: Upload APKs and AAB
        uses: actions/upload-artifact@v4
        with:
          name: PocketScan-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*release*.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
