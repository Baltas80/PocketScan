name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: pocketscan-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37b834c2c0c19d9d97ee3 # v7.0.0
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdf52807c6f64aa7b87af1c67c4e2 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@dccdc79a15655f1d16553a6ea594523bc73b5057 # v6.0.0
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build release AAB
        run: gradle bundleRelease --stacktrace
      - name: Verify installable debug APK and release bundle
        shell: bash
        run: |
          set -euo pipefail
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          final_apk="app/build/outputs/apk/debug/PocketScan-final.apk"
          release_aab="app/build/outputs/bundle/release/app-release.aab"

          test -s "$debug_apk"
          test -s "$release_aab"

          # The debug APK is deliberately the sideload/test artifact. It is signed by
          # the Android Gradle Plugin and is safe to install on a test device.
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$debug_apk"
          cp "$debug_apk" "$final_apk"

          echo "Installable APK: $final_apk"
          echo "Play bundle: $release_aab"

      - name: Run Android lint
        run: gradle lintDebug --stacktrace
      - name: Upload installable APK and AAB
        uses: actions/upload-artifact@86cae030d7830f3b8f7d3c7c17371ad2cfcb07b8 # v4.0.0
        with:
          name: PocketScan-builds
          path: |
            app/build/outputs/apk/debug/PocketScan-final.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
